<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ayyan Fireworks - Official Price List & Antigravity Catalog</title>
  <!-- Matter.js Physics Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 20%, #161f30 0%, #07090e 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      overflow-x: hidden;
    }

    /* Header Bar */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(10, 14, 24, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 204, 0, 0.25);
      padding: 10px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      flex-direction: column;
    }
    .brand h1 {
      font-size: 17px;
      font-weight: 800;
      color: #ffb703;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand span {
      font-size: 11px;
      color: #94a3b8;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .search-box {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      border-radius: 20px;
      color: #fff;
      font-size: 12px;
      outline: none;
      width: 160px;
    }
    .search-box:focus {
      border-color: #ffb703;
    }

    .toggle-btn {
      background: #ffb703;
      color: #0b0f19;
      font-weight: 700;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s;
    }
    .toggle-btn:hover {
      background: #ffa000;
      transform: scale(1.03);
    }

    /* Category Pill Filters */
    .filter-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      width: 100%;
      padding-top: 6px;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-pill {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 4px 12px;
      border-radius: 14px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .filter-pill:hover, .filter-pill.active {
      background: #ffb703;
      color: #0b0f19;
      font-weight: 700;
      border-color: #ffb703;
    }

    /* Main Showcase / Arena */
    #catalog-arena {
      position: absolute;
      top: 105px;
      left: 0;
      width: 100vw;
      height: calc(100vh - 105px);
      overflow-y: auto;
      padding: 16px;
      box-sizing: border-box;
    }

    /* Standard Grid Mode */
    #catalog-arena.grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
      justify-items: center;
      align-content: start;
      overflow-y: auto;
    }

    /* Antigravity Floating Mode */
    #catalog-arena.gravity-view {
      overflow: hidden;
      position: absolute;
      inset: 105px 0 0 0;
    }

    /* Product Card */
    .product-card {
      width: 155px;
      height: 195px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 215, 0, 0.22);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
      user-select: none;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .product-card:hover {
      border-color: #ffb703;
      box-shadow: 0 0 20px rgba(255, 183, 3, 0.4);
      transform: translateY(-3px);
    }

    .gravity-view .product-card {
      position: absolute;
      top: 0;
      left: 0;
      cursor: grab;
      margin: 0;
    }
    .gravity-view .product-card:active {
      cursor: grabbing;
    }

    .card-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9px;
      color: #94a3b8;
    }
    .card-category {
      background: rgba(255, 183, 3, 0.15);
      color: #ffb703;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .card-media {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px 0;
    }
    .card-media svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 2px 8px rgba(255, 183, 3, 0.35));
    }

    .card-name {
      font-size: 11px;
      font-weight: 600;
      color: #f1f5f9;
      line-height: 1.25;
      height: 28px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-meta {
      font-size: 9.5px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .card-bottom {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .card-price {
      font-size: 13px;
      font-weight: 800;
      color: #4ade80;
    }
    .card-btn {
      font-size: 9.5px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .card-btn:hover {
      background: rgba(56, 189, 248, 0.3);
    }
  </style>
</head>

    // High quality vector fireworks illustrations
    const SVG_ICONS = {
      sparkler: `<svg viewBox="0 0 64 64" fill="none"><path d="M12 52L36 28" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/><circle cx="44" cy="20" r="4" fill="#fbbf24"/><path d="M44 8v6M44 26v6M32 20h6M50 20h6M35 11l5 5M48 24l5 5M35 29l5-5M48 16l5-5" stroke="#fcd34d" stroke-width="2.5" stroke-linecap="round"/></svg>`,

    };

    const arena = document.getElementById("catalog-arena");
    const toggleBtn = document.getElementById("togglePhysicsBtn");
    const searchInput = document.getElementById("searchInput");
    let isAntigravity = false;
    let engine = null;
    let runner = null;
    let bodiesMap = [];

    // Filter state
    let activeCategory = "ALL";
    let searchTerm = "";

    function getFilteredItems() {
      return catalogData.filter(item => {
        const matchesCat = (activeCategory === "ALL") || 
          (item.category.toLowerCase() === activeCategory.toLowerCase());
        const matchesSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
          item.code.toLowerCase().includes(searchTerm.toLowerCase());
        return matchesCat && matchesSearch;
      });
    }

    function createCardElement(item) {
      const card = document.createElement("div");
      card.className = "product-card";
      card.setAttribute("data-code", item.code);

      const iconSvg = SVG_ICONS[item.type] || SVG_ICONS.bomb;
      const googleImgQuery = encodeURIComponent(`Ayyan Fireworks ${item.name} Sivakasi`);
      const googleSearchUrl = `https://www.google.com/search?tbm=isch&q=${googleImgQuery}`;

      card.innerHTML = `
        <div class="card-top">
          <span class="card-category">${item.category}</span>
          <span>#${item.code}</span>
        </div>
        <div class="card-media">${iconSvg}</div>
        <div class="card-name" title="${item.name}">${item.name}</div>
        <div class="card-meta">Per: ${item.per}</div>
        <div class="card-bottom">
          <div class="card-price">₹${item.rate.toLocaleString()}</div>
          <a class="card-btn" href="${googleSearchUrl}" target="_blank" title="Search packaging photo on Google">Google ↗</a>
        </div>
      `;
      return card;
    }

    // Render Grid
    function renderGrid() {
      cleanupPhysics();
      arena.className = "grid-view";
      arena.innerHTML = "";

      const items = getFilteredItems();
      if (items.length === 0) {
        arena.innerHTML = `<div style="grid-column: 1/-1; padding: 40px; text-align: center; color: #94a3b8;">No products found matching your search.</div>`;
        return;
      }

      items.forEach(item => {
        const card = createCardElement(item);
        arena.appendChild(card);
      });
    }

    // Antigravity Matter.js Physics Mode
    function startPhysics() {
      if (typeof Matter === "undefined") {
        alert("Matter.js could not be loaded from CDN. Falling back to Grid View.");
        isAntigravity = false;
        renderGrid();
        return;
      }

      arena.className = "gravity-view";
      arena.innerHTML = "";
      bodiesMap = [];

      const { Engine, Runner, Bodies, Composite, Mouse, MouseConstraint, Events } = Matter;

      engine = Engine.create();
      // Upward floating anti-gravity effect
      engine.gravity.y = -0.04;
      engine.gravity.x = 0;

      const w = arena.clientWidth || window.innerWidth;
      const h = arena.clientHeight || (window.innerHeight - 105);

      // Boundaries around the viewport
      const wallThickness = 80;
      const walls = [
        Bodies.rectangle(w / 2, -wallThickness / 2, w * 2, wallThickness, { isStatic: true }),
        Bodies.rectangle(w / 2, h + wallThickness / 2, w * 2, wallThickness, { isStatic: true }),
        Bodies.rectangle(-wallThickness / 2, h / 2, wallThickness, h * 2, { isStatic: true }),
        Bodies.rectangle(w + wallThickness / 2, h / 2, wallThickness, h * 2, { isStatic: true })
      ];
      Composite.add(engine.world, walls);

      // Create cards and assign physics bodies
      const items = getFilteredItems().slice(0, 36); // Keep viewport light and responsive
      items.forEach((item) => {
        const card = createCardElement(item);
        arena.appendChild(card);

        const cardW = 155;
        const cardH = 195;
        const posX = Math.random() * (w - cardW - 40) + 20;
        const posY = Math.random() * (h - cardH - 40) + 20;

        const body = Bodies.rectangle(posX, posY, cardW, cardH, {
          chamfer: { radius: 14 },
          restitution: 0.8,
          frictionAir: 0.02
        });

        Composite.add(engine.world, body);
        bodiesMap.push({ body, card, w: cardW, h: cardH });
      });

      // Mouse Dragging in Physics
      const mouse = Mouse.create(arena);
      const mouseConstraint = MouseConstraint.create(engine, {
        mouse: mouse,
        constraint: { stiffness: 0.2, render: { visible: false } }
      });
      Composite.add(engine.world, mouseConstraint);

      // Sync Body transforms to DOM elements
      Events.on(engine, "afterUpdate", () => {
        bodiesMap.forEach(({ body, card, w: bw, h: bh }) => {
          const x = body.position.x - bw / 2;
          const y = body.position.y - bh / 2;
          card.style.transform = `translate3d(${x}px, ${y}px, 0) rotate(${body.angle}rad)`;
        });
      });

      runner = Runner.create();
      Runner.run(runner, engine);
    }

    function cleanupPhysics() {
      if (runner && engine) {
        Matter.Runner.stop(runner);
        Matter.Engine.clear(engine);
        runner = null;
        engine = null;
      }
      bodiesMap = [];
    }

    // Toggle Antigravity Mode
    toggleBtn.addEventListener("click", () => {
      isAntigravity = !isAntigravity;
      if (isAntigravity) {
        toggleBtn.innerText = "🌀 Antigravity: ON";
        toggleBtn.style.background = "#4ade80";
        startPhysics();
      } else {
        toggleBtn.innerText = "🌀 Antigravity: OFF";
        toggleBtn.style.background = "#ffb703";
        renderGrid();
      }
    });

    // Category Filter Clicks
    document.querySelectorAll(".filter-pill").forEach(pill => {
      pill.addEventListener("click", () => {
        document.querySelectorAll(".filter-pill").forEach(p => p.classList.remove("active"));
        pill.classList.add("active");
        activeCategory = pill.getAttribute("data-cat");
        if (isAntigravity) startPhysics();
        else renderGrid();
      });
    });

    // Search Input
    searchInput.addEventListener("input", (e) => {
      searchTerm = e.target.value.trim();
      if (isAntigravity) startPhysics();
      else renderGrid();
    });

    // Handle Window Resizing
    window.addEventListener("resize", () => {
      if (isAntigravity) startPhysics();
    });

    // Initial Render
    document.addEventListener("DOMContentLoaded", () => {
      renderGrid();
    });
  </script>
</body>
</html>
